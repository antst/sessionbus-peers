name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.24.x'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
      - name: Build archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          GOWORK: 'off'
        run: |
          version=${RELEASE_TAG#v}
          mkdir -p dist/payload
          for binary in claude-peer codex-peer grok-peer qwen-peer opencode-peer; do
            CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -trimpath -ldflags "-s -w -X main.version=$RELEASE_TAG" -o "dist/payload/$binary" "./cmd/$binary"
          done
          cp LICENSE dist/payload/LICENSE
          archive="sessionbus-peers_${version}_${TARGET_OS}_${TARGET_ARCH}.tar.gz"
          tar -czf "dist/$archive" -C dist/payload LICENSE claude-peer codex-peer grok-peer qwen-peer opencode-peer
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/sessionbus-peers_*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Verify promised assets and write checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            test -f "dist/sessionbus-peers_${version}_${target}.tar.gz"
          done
          test "$(find dist -maxdepth 1 -type f -name 'sessionbus-peers_*.tar.gz' | wc -l)" -eq 4
          (cd dist && sha256sum sessionbus-peers_*.tar.gz > SHA256SUMS)
          test "$(wc -l < dist/SHA256SUMS)" -eq 4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/sessionbus-peers_*.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes

  install-test:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install this release
        env:
          SESSIONBUS_PEERS_VERSION: ${{ github.ref_name }}
          SESSIONBUS_PREFIX: ${{ runner.temp }}/sessionbus-peers-bin
        run: sh ./install.sh
      - name: Verify every installed binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SESSIONBUS_PREFIX: ${{ runner.temp }}/sessionbus-peers-bin
        run: |
          for binary in claude-peer codex-peer grok-peer qwen-peer opencode-peer; do
            test "$("$SESSIONBUS_PREFIX/$binary" --version)" = "$RELEASE_TAG"
          done
