name: Package checks and scoped previews

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Verify package boundary
        working-directory: opencode
        run: |
          npm install --ignore-scripts --no-package-lock
          npm test
          go run ../internal/cmd/stage-native-plugin -repo .. -product opencode -output "$RUNNER_TEMP/native-plugin/opencode"
          cd "$RUNNER_TEMP/native-plugin/opencode"
          npm pack --dry-run --json > /tmp/sessionbus-opencode-pack.json
          node - <<'NODE'
          const report = require('/tmp/sessionbus-opencode-pack.json')[0]
          const got = report.files.map((file) => file.path).sort()
          const want = [
            'README.md',
            'activation.mjs',
            'delivery.mjs',
            'endpoint.mjs',
            'forward.mjs',
            'gate.mjs',
            'owners.mjs',
            'package.json',
            'peer.mjs',
            'profile.mjs',
            'readiness.mjs',
            'server.mjs',
            'sessionbus-tool.json',
            'skills/sessionbus/SKILL.md',
            'tui.mjs',
          ].sort()
          if (JSON.stringify(got) !== JSON.stringify(want)) {
            throw new Error(`unexpected OpenCode pack files: ${JSON.stringify(got)}`)
          }
          const manifest = require('./package.json')
          if (manifest.repository?.url !== 'git+https://github.com/antst/sessionbus-peers.git' ||
              manifest.repository?.directory !== 'opencode') {
            throw new Error('OpenCode repository metadata is invalid')
          }
          NODE
      - run: npx --yes pkg-pr-new publish "$RUNNER_TEMP/native-plugin/opencode"

  claude-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Verify Claude Go archive and installed layout
        run: |
          go test -race ./wrappers/claude/interactive ./cmd/claude-peer
          ./scripts/package-claude "${RUNNER_TEMP}/claude archive"
      - uses: actions/upload-artifact@v4
        with:
          name: claude-go-linux-amd64
          path: ${{ runner.temp }}/claude archive/*.tar.gz
